<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-labelledby="t d"><title id="t">Tre kontrollbilder og en blanding</title><desc id="d">Jevnt bilde gir H-måling null. Tre ganger H gir tre. Minus tre ganger H gir minus tre. Blandingen gir minus én. Alle bilder bruker samme gråskala og viser pikselverdier.</desc><rect width="800" height="270" fill="white"/><text x="95" y="25" text-anchor="middle" font-family="sans-serif" font-size="18">Jevnt bilde</text><rect x="30" y="40" width="65" height="65" fill="rgb(195,195,195)" stroke="#64748b"/><text x="62" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">1</text><rect x="95" y="40" width="65" height="65" fill="rgb(195,195,195)" stroke="#64748b"/><text x="127" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">1</text><rect x="30" y="105" width="65" height="65" fill="rgb(195,195,195)" stroke="#64748b"/><text x="62" y="145" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">1</text><rect x="95" y="105" width="65" height="65" fill="rgb(195,195,195)" stroke="#64748b"/><text x="127" y="145" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">1</text><text x="95" y="200" text-anchor="middle" font-family="sans-serif" font-size="18">H-måling: 0</text><text x="295" y="25" text-anchor="middle" font-family="sans-serif" font-size="18">3 ganger H</text><rect x="230" y="40" width="65" height="65" fill="rgb(225,225,225)" stroke="#64748b"/><text x="262" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">1,5</text><rect x="295" y="40" width="65" height="65" fill="rgb(45,45,45)" stroke="#64748b"/><text x="327" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">-1,5</text><rect x="230" y="105" width="65" height="65" fill="rgb(225,225,225)" stroke="#64748b"/><text x="262" y="145" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">1,5</text><rect x="295" y="105" width="65" height="65" fill="rgb(45,45,45)" stroke="#64748b"/><text x="327" y="145" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">-1,5</text><text x="295" y="200" text-anchor="middle" font-family="sans-serif" font-size="18">H-måling: 3</text><text x="495" y="25" text-anchor="middle" font-family="sans-serif" font-size="18">−3 ganger H</text><rect x="430" y="40" width="65" height="65" fill="rgb(45,45,45)" stroke="#64748b"/><text x="462" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">-1,5</text><rect x="495" y="40" width="65" height="65" fill="rgb(225,225,225)" stroke="#64748b"/><text x="527" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">1,5</text><rect x="430" y="105" width="65" height="65" fill="rgb(45,45,45)" stroke="#64748b"/><text x="462" y="145" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#fff">-1,5</text><rect x="495" y="105" width="65" height="65" fill="rgb(225,225,225)" stroke="#64748b"/><text x="527" y="145" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">1,5</text><text x="495" y="200" text-anchor="middle" font-family="sans-serif" font-size="18">H-måling: −3</text><text x="695" y="25" text-anchor="middle" font-family="sans-serif" font-size="18">Blandingen x</text><rect x="630" y="40" width="65" height="65" fill="rgb(180,180,180)" stroke="#64748b"/><text x="662" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">0,75</text><rect x="695" y="40" width="65" height="65" fill="rgb(240,240,240)" stroke="#64748b"/><text x="727" y="80" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">1,75</text><rect x="630" y="105" width="65" height="65" fill="rgb(150,150,150)" stroke="#64748b"/><text x="662" y="145" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">0,25</text><rect x="695" y="105" width="65" height="65" fill="rgb(210,210,210)" stroke="#64748b"/><text x="727" y="145" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#111">1,25</text><text x="695" y="200" text-anchor="middle" font-family="sans-serif" font-size="18">H-måling: −1</text><text x="400" y="245" text-anchor="middle" font-family="sans-serif" font-size="15">Samme gråskala i alle bilder: mørkere = lavere verdi, lysere = høyere verdi.</text></svg>