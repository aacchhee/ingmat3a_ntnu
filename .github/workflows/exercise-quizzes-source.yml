name: Exercise quiz source contract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check manifest audit canaries
        run: python -m unittest discover -s tests -p test_exercise_quizzes.py -v
      - name: Preserve baseline content and validate the quiz inventory
        run: python scripts/audit-exercise-quizzes.py
