name: Bygg og publiser lineær algebra

# Publiserer forhåndsvisningen fra linalg-branch under /linalg.
on:
  push:
    branches:
      - linalg-branch
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-linalg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent emnerepositoriet
        uses: actions/checkout@v6

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer Python-avhengigheter
        run: python -m pip install jupyter nbformat pyyaml

      - name: Installer Quarto-utvidelser
        run: python scripts/setup.py

      - name: Bygg nettstedet
        run: quarto render

      - name: Publiser under /linalg
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          destination_dir: linalg
          keep_files: true
