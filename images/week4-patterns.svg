<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="title desc"><title id="title">Fire bildemønstre</title><desc id="desc">M er jevnt lyst. H er lyst til venstre. V er lyst øverst. D er lyst langs diagonalen. Lyse ruter betyr pluss en halv, mørke minus en halv. Tallene 1 til 4 viser leserekkefølgen.</desc><rect width="760" height="230" fill="white"/><text x="90" y="25" text-anchor="middle" font-family="sans-serif" font-size="20">M: jevnt nivå</text><rect x="25" y="40" width="65" height="65" fill="#f1f5f9" stroke="#64748b"/><text x="32" y="56" font-family="sans-serif" font-size="12" fill="#475569">1</text><text x="57" y="82" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#0f172a">+½</text><rect x="90" y="40" width="65" height="65" fill="#f1f5f9" stroke="#64748b"/><text x="97" y="56" font-family="sans-serif" font-size="12" fill="#475569">2</text><text x="122" y="82" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#0f172a">+½</text><rect x="25" y="105" width="65" height="65" fill="#f1f5f9" stroke="#64748b"/><text x="32" y="121" font-family="sans-serif" font-size="12" fill="#475569">3</text><text x="57" y="147" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#0f172a">+½</text><rect x="90" y="105" width="65" height="65" fill="#f1f5f9" stroke="#64748b"/><text x="97" y="121" font-family="sans-serif" font-size="12" fill="#475569">4</text><text x="122" y="147" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#0f172a">+½</text><text x="280" y="25" text-anchor="middle" font-family="sans-serif" font-size="20">H: venstre–høyre</text><rect x="215" y="40" width="65" height="65" fill="#f1f5f9" stroke="#64748b"/><text x="222" y="56" font-family="sans-serif" font-size="12" fill="#475569">1</text><text x="247" y="82" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#0f172a">+½</text><rect x="280" y="40" width="65" height="65" fill="#334155" stroke="#64748b"/><text x="287" y="56" font-family="sans-serif" font-size="12" fill="#cbd5e1">2</text><text x="312" y="82" text-anchor="middle" font-family="sans-serif" font-size="20" fill="white">−½</text><rect x="215" y="105" width="65" height="65" fill="#f1f5f9" stroke="#64748b"/><text x="222" y="121" font-family="sans-serif" font-size="12" fill="#475569">3</text><text x="247" y="147" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#0f172a">+½</text><rect x="280" y="105" width="65" height="65" fill="#334155" stroke="#64748b"/><text x="287" y="121" font-family="sans-serif" font-size="12" fill="#cbd5e1">4</text><text x="312" y="147" text-anchor="middle" font-family="sans-serif" font-size="20" fill="white">−½</text><text x="470" y="25" text-anchor="middle" font-family="sans-serif" font-size="20">V: oppe–nede</text><rect x="405" y="40" width="65" height="65" fill="#f1f5f9" stroke="#64748b"/><text x="412" y="56" font-family="sans-serif" font-size="12" fill="#475569">1</text><text x="437" y="82" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#0f172a">+½</text><rect x="470" y="40" width="65" height="65" fill="#f1f5f9" stroke="#64748b"/><text x="477" y="56" font-family="sans-serif" font-size="12" fill="#475569">2</text><text x="502" y="82" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#0f172a">+½</text><rect x="405" y="105" width="65" height="65" fill="#334155" stroke="#64748b"/><text x="412" y="121" font-family="sans-serif" font-size="12" fill="#cbd5e1">3</text><text x="437" y="147" text-anchor="middle" font-family="sans-serif" font-size="20" fill="white">−½</text><rect x="470" y="105" width="65" height="65" fill="#334155" stroke="#64748b"/><text x="477" y="121" font-family="sans-serif" font-size="12" fill="#cbd5e1">4</text><text x="502" y="147" text-anchor="middle" font-family="sans-serif" font-size="20" fill="white">−½</text><text x="660" y="25" text-anchor="middle" font-family="sans-serif" font-size="20">D: diagonal</text><rect x="595" y="40" width="65" height="65" fill="#f1f5f9" stroke="#64748b"/><text x="602" y="56" font-family="sans-serif" font-size="12" fill="#475569">1</text><text x="627" y="82" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#0f172a">+½</text><rect x="660" y="40" width="65" height="65" fill="#334155" stroke="#64748b"/><text x="667" y="56" font-family="sans-serif" font-size="12" fill="#cbd5e1">2</text><text x="692" y="82" text-anchor="middle" font-family="sans-serif" font-size="20" fill="white">−½</text><rect x="595" y="105" width="65" height="65" fill="#334155" stroke="#64748b"/><text x="602" y="121" font-family="sans-serif" font-size="12" fill="#cbd5e1">3</text><text x="627" y="147" text-anchor="middle" font-family="sans-serif" font-size="20" fill="white">−½</text><rect x="660" y="105" width="65" height="65" fill="#f1f5f9" stroke="#64748b"/><text x="667" y="121" font-family="sans-serif" font-size="12" fill="#475569">4</text><text x="692" y="147" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#0f172a">+½</text><text x="380" y="210" text-anchor="middle" font-family="sans-serif" font-size="16">Les øverste rad først (1, 2), deretter nederste rad (3, 4).</text></svg>