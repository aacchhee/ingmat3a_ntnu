<script>
// Reveal tab ancestors before navigating to a fragment in Quarto's tabsets.
(() => {
  let navigation = 0;

  function fragmentTarget(hash) {
    if (!hash || hash === '#') return null;
    try { return document.getElementById(decodeURIComponent(hash.slice(1))); }
    catch (_) { return null; }
  }

  function tabAncestors(target) {
    const panes = [];
    for (let el = target; el; el = el.parentElement) {
      if (el.classList.contains('tab-pane')) panes.unshift(el);
    }
    return panes;
  }

  function openTab(pane) {
    if (pane.classList.contains('active')) return Promise.resolve();
    const tab = document.getElementById(pane.getAttribute('aria-labelledby'));
    if (!tab || !window.bootstrap?.Tab) return Promise.resolve();
    return new Promise(resolve => {
      tab.addEventListener('shown.bs.tab', resolve, { once: true });
      window.bootstrap.Tab.getOrCreateInstance(tab).show();
    });
  }

  async function reveal(target) {
    const request = ++navigation;
    for (const pane of tabAncestors(target)) {
      if (request !== navigation) return;
      await openTab(pane);
    }
    if (request !== navigation) return;
    // Let newly visible figures and Quarto's layout handlers update first.
    window.dispatchEvent(new Event('resize'));
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (request !== navigation || !target.getClientRects().length) return;
      const header = document.getElementById('quarto-header');
      const clearance = header ? Math.max(0, header.getBoundingClientRect().bottom) : 0;
      window.scrollTo({ top: Math.max(0, window.scrollY + target.getBoundingClientRect().top - clearance - 16), behavior: 'auto' });
    }));
  }

  document.addEventListener('click', event => {
    if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const link = event.target.closest?.('a[href]');
    if (!link || link.hasAttribute('download') || (link.target && link.target !== '_self') || link.getAttribute('role') === 'tab') return;
    const url = new URL(link.href, window.location.href);
    if (url.origin !== location.origin || url.pathname !== location.pathname || url.search !== location.search) return;
    const target = fragmentTarget(url.hash);
    if (!target || !tabAncestors(target).length || !window.bootstrap?.Tab) return;
    event.preventDefault();
    // Avoid another fragment handler scrolling while the destination is hidden.
    event.stopPropagation();
    if (location.hash !== url.hash) history.pushState(null, '', url.hash);
    void reveal(target);
  }, true);

  function revealHash() {
    const target = fragmentTarget(location.hash);
    if (target && tabAncestors(target).length) void reveal(target);
  }
  window.addEventListener('hashchange', revealHash);
  // pageshow also covers direct links and returning from another page via Back.
  window.addEventListener('pageshow', () => requestAnimationFrame(revealHash));
})();
</script>
