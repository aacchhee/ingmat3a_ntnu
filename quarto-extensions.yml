# The course uses the tested CTM Assessment package: ctm-libs, ctm-checkers,
# math-exercise, py-exercise, pyodide-interaktiv and JSXGraph at commits tested together
# (ctm-assessment's integration/feedback/repos.json). Install with
# `python scripts/setup.py`.
#
# ref: a ctm-assessment branch or commit. `main` follows the tested package;
# a commit or release tag pins it, for example for a semester.
plugins:
  - name: ctm-assessment
    repo: https://github.com/Erasmus-CTM/ctm-assessment.git
    # Immutable coherent package accepted in ctm-demo, including first-visit
    # loading/failure-isolation, saving, progress and mixed quizzes.
    ref: 503c8688eaf556ff23af0fc629ca60f71833ea73
